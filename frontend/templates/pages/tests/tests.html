    <style>
        .tests-container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .test-card {
            transition: all 0.2s ease;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
        }
        .test-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(11, 15, 20, 0.08);
        }
        .test-card .test-header {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--line-soft);
            flex-wrap: wrap;
            gap: 6px;
        }
        .test-card .test-body {
            padding: 14px 16px 16px;
        }
        .test-card .test-title {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 4px;
        }
        .test-card .test-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 12px;
            color: var(--ink-soft);
        }
        .test-card .test-meta .material-icons {
            font-size: 16px;
        }
        .test-card .test-footer {
            padding: 10px 16px;
            border-top: 1px solid var(--line-soft);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        .test-card .test-footer .btn {
            font-size: 12px;
            padding: 5px 14px;
        }

        .status-badge {
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .status-badge.active {
            background: var(--hard-bg);
            color: var(--hard);
        }
        .status-badge.upcoming {
            background: var(--info-bg);
            color: var(--info);
        }
        .status-badge.ended {
            background: var(--surface-2);
            color: var(--ink-soft);
        }
        .status-badge.completed {
            background: var(--easy-bg);
            color: var(--easy);
        }

        .filter-chip {
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 1.5px solid var(--line);
            background: #fff;
            color: var(--ink-soft);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .filter-chip:hover {
            border-color: var(--ink);
            color: var(--ink);
        }
        .filter-chip.active {
            background: var(--ink);
            color: #fff;
            border-color: var(--ink);
        }
        .filter-chip .count {
            background: var(--surface-2);
            padding: 0 6px;
            border-radius: 99px;
            font-size: 10px;
            margin-left: 2px;
        }
        .filter-chip.active .count {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .search-wrapper {
            position: relative;
        }
        .search-wrapper .material-icons {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--ink-faint);
        }
        .search-wrapper input {
            width: 100%;
            padding: 11px 14px 11px 44px;
            border: 1px solid var(--line);
            border-radius: 999px;
            font-size: 14px;
            background: #fff;
            color: var(--ink);
            transition: border-color 0.15s ease;
        }
        .search-wrapper input:focus {
            border-color: var(--ink);
            outline: none;
        }
        .search-wrapper input::placeholder {
            color: var(--ink-faint);
        }

        .skeleton-card {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--line);
            background: #fff;
        }
        .skeleton-card .skeleton-header {
            height: 50px;
            background: linear-gradient(90deg, #f1f2f4 25%, #f8f9fa 37%, #f1f2f4 63%);
            background-size: 400% 100%;
            animation: skeleton-loading 1.4s ease infinite;
        }
        .skeleton-card .skeleton-body {
            padding: 14px 16px;
        }
        .skeleton-card .skeleton-line {
            height: 12px;
            background: linear-gradient(90deg, #f1f2f4 25%, #f8f9fa 37%, #f1f2f4 63%);
            background-size: 400% 100%;
            animation: skeleton-loading 1.4s ease infinite;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        .skeleton-card .skeleton-line.short {
            width: 60%;
        }
        .skeleton-card .skeleton-line.medium {
            width: 80%;
        }

        @keyframes skeleton-loading {
            0% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0 50%;
            }
        }

        .material-icons {
            font-size: 20px;
            vertical-align: middle;
        }
        .material-icons.small {
            font-size: 16px;
        }

        .score-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
        }
        .score-circle.passed {
            background: var(--easy-bg);
            color: var(--easy);
        }
        .score-circle.failed {
            background: var(--hard-bg);
            color: var(--hard);
        }
        .score-circle.pending {
            background: var(--surface-2);
            color: var(--ink-soft);
        }

        @media (max-width: 640px) {
            .tests-container {
                padding: 0 16px;
            }
            .test-card .test-title {
                font-size: 14px;
            }
            .test-card .test-meta {
                font-size: 11px;
                gap: 8px;
            }
            .filter-chip {
                padding: 4px 12px;
                font-size: 11px;
            }
            .search-wrapper input {
                font-size: 13px;
                padding: 10px 12px 10px 38px;
            }
            .score-circle {
                width: 36px;
                height: 36px;
                font-size: 12px;
            }
        }

        @media (max-width: 400px) {
            .tests-container {
                padding: 0 12px;
            }
            .test-card .test-header {
                padding: 10px 12px;
            }
            .test-card .test-body {
                padding: 10px 12px 12px;
            }
            .test-card .test-footer {
                padding: 8px 12px;
            }
            .filter-chip {
                padding: 3px 10px;
                font-size: 10px;
            }
        }
    </style>
</head>

    <!-- ===== TOPBAR ===== -->

                        <button class="filter-chip" data-status="ended">

                        </button>
                        <button class="filter-chip" data-status="completed">
                            <span class="material-icons small" style="font-size:14px;">celebration</span> Tugatilgan <span class="count" id="statusCompletedCount">0</span>

                </div>

                <div class="flex flex-wrap items-center gap-2">

                    <div class="flex flex-wrap gap-1.5" id="difficultyFilters">

                        <button class="filter-chip" data-diff="easy">
                            <span class="material-icons small" style="font-size:14px;">check_circle</span> Oson
                        </button>
                        <button class="filter-chip" data-diff="medium">
                            <span class="material-icons small" style="font-size:14px;">warning</span> O'rtacha
                        </button>
                        <button class="filter-chip" data-diff="hard">
                            <span class="material-icons small" style="font-size:14px;">error</span> Murakkab
                        </button>
                    </div>
                </div>

                <!-- Sort -->
                <div class="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-line-soft">
                    <div class="flex items-center gap-3">
                        <span class="material-icons small text-inkfaint">sort</span>
                        <select id="sortSelect" class="select w-auto text-xs py-1.5">
                            <option value="newest">Eng yangi</option>
                            <option value="oldest">Eng eski</option>
                            <option value="duration">Qisqa vaqt</option>
                            <option value="questions">Ko'p savol</option>
                        </select>
                    </div>
                    <div class="text-xs text-inksoft">
                        <span id="displayCount">0</span> ta ko'rsatilmoqda
                    </div>
                </div>
            </div>

            <!-- Tests Grid -->
            <div id="testsContainer">
                <div id="testsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                    <!-- Skeletons -->
                    <div class="skeleton-card">
                        <div class="skeleton-header"></div>
                        <div class="skeleton-body">
                            <div class="skeleton-line"></div>
                            <div class="skeleton-line short"></div>
                            <div class="skeleton-line medium" style="margin-top:10px;"></div>
                            <div class="skeleton-line short" style="margin-top:4px;"></div>
                        </div>
                    </div>
                    <div class="skeleton-card">
                        <div class="skeleton-header"></div>
                        <div class="skeleton-body">
                            <div class="skeleton-line"></div>
                            <div class="skeleton-line short"></div>
                            <div class="skeleton-line medium" style="margin-top:10px;"></div>
                            <div class="skeleton-line short" style="margin-top:4px;"></div>
                        </div>
                    </div>
                    <div class="skeleton-card">
                        <div class="skeleton-header"></div>
                        <div class="skeleton-body">
                            <div class="skeleton-line"></div>
                            <div class="skeleton-line short"></div>
                            <div class="skeleton-line medium" style="margin-top:10px;"></div>
                            <div class="skeleton-line short" style="margin-top:4px;"></div>
                        </div>
                    </div>
                </div>

                <!-- Load more -->
                <div class="flex items-center justify-center mt-8">
                    <button id="loadMoreBtn" class="btn btn-outline text-sm hidden">
                        <span class="material-icons small">expand_more</span>
                        Yana yuklash <span class="font-mono" id="remainingCount">0</span> ta
                    </button>
                </div>

                <!-- Empty state -->
                <div id="emptyState" class="hidden text-center py-16 text-inksoft">
                    <span class="material-icons" style="font-size:64px;">quiz</span>
                    <h3 class="font-display font-bold text-xl mt-4 mb-2">Testlar topilmadi</h3>
                    <p>Qidiruv shartlariga mos test mavjud emas.</p>
                    <button onclick="resetFilters()" class="btn btn-outline mt-4">
                        <span class="material-icons small">refresh</span> Filtrlarni tozalash
                    </button>
                </div>
            </div>

        </div>

    </main>

    <!-- Toast -->
    <div id="toast-container"></div>

            };

            // ============================================================
            // DOM REFS
            // ============================================================
            var grid = document.getElementById('testsGrid');
            var loadMoreBtn = document.getElementById('loadMoreBtn');
            var remainingCount = document.getElementById('remainingCount');
            var displayCount = document.getElementById('displayCount');
            var emptyState = document.getElementById('emptyState');
            var searchInput = document.getElementById('searchInput');
            var totalCount = document.getElementById('totalCount');
            var completedCount = document.getElementById('completedCount');
            var activeCount = document.getElementById('activeCount');

            // ============================================================
            // HELPERS
            // ============================================================
            function escapeHtml(str) {
                if (!str) return '';
                var d = document.createElement('div');
                d.textContent = str;
                return d.innerHTML;
            }

            function getStatusBadge(status) {
                var map = {
                    active: ['active', 'play_circle', '⏺ Faol'],
                    upcoming: ['upcoming', 'event', '📅 Kutilmoqda'],
                    ended: ['ended', 'check_circle', '✅ Yakunlangan'],
                    completed: ['completed', 'celebration', '🎓 Tugatilgan']
                };
                var pair = map[status] || map.ended;
                return '<span class="status-badge ' + pair[0] + '"><span class="material-icons small" style="font-size:14px;">' +
                    pair[1] + '</span> ' + pair[2] + '</span>';
            }

            function getDifficultyBadge(diff) {
                var map = {
                    easy: ['badge-easy', 'check_circle', 'Oson'],
                    medium: ['badge-medium', 'warning', 'O\'rtacha'],
                    hard: ['badge-hard', 'error', 'Murakkab']
                };
                var pair = map[diff] || map.medium;
                return '<span class="badge ' + pair[0] + '"><span class="material-icons small" style="font-size:14px;">' +
                    pair[1] + '</span> ' + pair[2] + '</span>';
            }

            function getScoreCircle(test) {
                if (test.completed && test.score !== null) {
                    var passed = test.score >= test.passScore;
                    return '<div class="score-circle ' + (passed ? 'passed' : 'failed') + '">' + test.score + '%</div>';
                }
                return '<div class="score-circle pending"><span class="material-icons" style="font-size:16px;">remove</span></div>';
            }

            function renderTest(t) {
                var status = t.completed ? 'completed' : t.status;
                var statusBadge = getStatusBadge(status);
                var diffBadge = getDifficultyBadge(t.difficulty);
                var scoreCircle = getScoreCircle(t);

                var btnText = t.completed ? 'Natijalarni ko\'rish' : (t.status === 'active' ? 'Boshlash' : 'Batafsil');
                var btnClass = t.completed ? 'btn-outline' : (t.status === 'active' ? 'btn-primary' : 'btn-outline');

                return '<a href="/test-detail.html?slug=' + t.slug + '" class="test-card card hover:no-underline">' +
                    '<div class="test-header">' +
                    statusBadge +
                    diffBadge +
                    '</div>' +
                    '<div class="test-body">' +
                    '<div class="test-title">' + escapeHtml(t.title) + '</div>' +
                    '<div class="test-description text-sm text-inksoft mb-3 line-clamp-2">' + escapeHtml(t
                        .description) + '</div>' +
                    '<div class="test-meta">' +
                    '<span><span class="material-icons small">quiz</span> ' + t.questions + ' savol</span>' +
                    '<span><span class="material-icons small">schedule</span> ' + t.duration + ' daq</span>' +
                    '<span><span class="material-icons small">trending_up</span> ' + t.passScore + '%</span>' +
                    '<span><span class="material-icons small">bolt</span> +' + t.xp + ' XP</span>' +
                    '</div>' +
                    '</div>' +
                    '<div class="test-footer">' +
                    '<div class="flex items-center gap-2">' +
                    scoreCircle +
                    '<span class="text-xs text-inksoft">' + (t.completed ? 'Tugatilgan' : '') + '</span>' +
                    '</div>' +
                    '<span class="btn ' + btnClass + ' btn-sm">' + btnText + ' <span class="material-icons small" style="font-size:14px;">arrow_forward</span></span>' +
                    '</div>' +
                    '</a>';
            }

            function renderSkeletons(count) {
                var html = '';
                for (var i = 0; i < count; i++) {
                    html += '<div class="skeleton-card">' +
                        '<div class="skeleton-header"></div>' +
                        '<div class="skeleton-body">' +
                        '<div class="skeleton-line"></div>' +
                        '<div class="skeleton-line short"></div>' +
                        '<div class="skeleton-line medium" style="margin-top:10px;"></div>' +
                        '<div class="skeleton-line short" style="margin-top:4px;"></div>' +
                        '</div>' +
                        '</div>';
                }
                return html;
            }

            function renderEmpty() {
                emptyState.classList.remove('hidden');
                grid.innerHTML = '';
            }

            function renderStats(filtered) {
                var total = filtered.length;
                var completed = filtered.filter(function(t) { return t.completed; }).length;
                var active = filtered.filter(function(t) { return t.status === 'active' && !t.completed; }).length;
                var upcoming = filtered.filter(function(t) { return t.status === 'upcoming' && !t.completed; }).length;
                var ended = filtered.filter(function(t) { return t.status === 'ended' && !t.completed; }).length;

                totalCount.textContent = total;
                completedCount.textContent = completed;
                activeCount.textContent = active;

                document.getElementById('statusAllCount').textContent = total;
                document.getElementById('statusActiveCount').textContent = active;
                document.getElementById('statusUpcomingCount').textContent = upcoming;
                document.getElementById('statusEndedCount').textContent = ended;
                document.getElementById('statusCompletedCount').textContent = completed;
            }

            // ============================================================
            // FILTER
            // ============================================================
            function getFiltered() {
                var result = allTests.slice();

                if (state.search) {
                    var s = state.search.toLowerCase();
                    result = result.filter(function(t) {
                        return t.title.toLowerCase().includes(s) ||
                            t.description.toLowerCase().includes(s);
                    });
                }

                if (state.status === 'completed') {
                    result = result.filter(function(t) { return t.completed; });
                } else if (state.status !== 'all') {
                    result = result.filter(function(t) {
                        return t.status === state.status && !t.completed;
                    });
                }

                if (state.difficulty !== 'all') {
                    result = result.filter(function(t) { return t.difficulty === state.difficulty; });
                }

                var sortMap = {
                    'newest': function(a, b) { return b.id - a.id; },
                    'oldest': function(a, b) { return a.id - b.id; },
                    'duration': function(a, b) { return a.duration - b.duration; },
                    'questions': function(a, b) { return b.questions - a.questions; }
                };
                if (sortMap[state.sort]) {
                    result.sort(sortMap[state.sort]);
                }

                return result;
            }

            // ============================================================
            // LOAD MORE
            // ============================================================
            function loadMore() {
                if (state.loading || !state.hasMore) return;
                state.loading = true;
                loadMoreBtn.disabled = true;
                loadMoreBtn.innerHTML = '<span class="material-icons small">hourglass_top</span> Yuklanmoqda...';

                setTimeout(function() {
                    var start = (state.page - 1) * state.pageSize;
                    var end = start + state.pageSize;
                    var chunk = state.filtered.slice(start, end);

                    if (chunk.length === 0) {
                        state.hasMore = false;
                        state.loading = false;
                        loadMoreBtn.classList.add('hidden');
                        return;
                    }

                    var html = chunk.map(renderTest).join('');
                    grid.insertAdjacentHTML('beforeend', html);

                    state.page++;
                    state.loading = false;

                    if (end >= state.filtered.length) {
                        state.hasMore = false;
                        loadMoreBtn.classList.add('hidden');
                    } else {
                        loadMoreBtn.classList.remove('hidden');
                    }

                    var displayed = state.page - 1;
                    var totalDisplayed = Math.min(displayed * state.pageSize, state.filtered.length);
                    displayCount.textContent = totalDisplayed;
                    var remaining = state.filtered.length - totalDisplayed;
                    remainingCount.textContent = remaining > 0 ? remaining : 0;
                    loadMoreBtn.innerHTML = '<span class="material-icons small">expand_more</span> Yana yuklash <span class="font-mono">' +
                        remaining + '</span> ta';
                    loadMoreBtn.disabled = false;

                }, 400);
            }

            // ============================================================
            // REFRESH
            // ============================================================
            function refresh() {
                state.page = 1;
                state.hasMore = true;
                state.loading = false;
                grid.innerHTML = '';
                emptyState.classList.add('hidden');

                state.filtered = getFiltered();
                renderStats(state.filtered);

                if (state.filtered.length === 0) {
                    renderEmpty();
                    loadMoreBtn.classList.add('hidden');
                    displayCount.textContent = '0';
                    return;
                }

                grid.innerHTML = renderSkeletons(Math.min(state.pageSize, state.filtered.length));

                setTimeout(function() {
                    var firstChunk = state.filtered.slice(0, state.pageSize);
                    grid.innerHTML = firstChunk.map(renderTest).join('');
                    state.page = 2;

                    if (state.filtered.length <= state.pageSize) {
                        state.hasMore = false;
                        loadMoreBtn.classList.add('hidden');
                    } else {
                        loadMoreBtn.classList.remove('hidden');
                        var remaining = state.filtered.length - state.pageSize;
                        remainingCount.textContent = remaining;
                        loadMoreBtn.innerHTML = '<span class="material-icons small">expand_more</span> Yana yuklash <span class="font-mono">' +
                            remaining + '</span> ta';
                    }

                    displayCount.textContent = Math.min(state.pageSize, state.filtered.length);
                }, 300);
            }

            // ============================================================
            // RESET FILTERS
            // ============================================================
            function resetFilters() {
                state.search = '';
                state.status = 'all';
                state.difficulty = 'all';
                state.sort = 'newest';
                searchInput.value = '';

                document.querySelectorAll('#statusFilters .filter-chip, #difficultyFilters .filter-chip')
                    .forEach(function(el) {
                        el.classList.remove('active');
                    });
                document.querySelector('#statusFilters .filter-chip[data-status="all"]').classList.add('active');
                document.querySelector('#difficultyFilters .filter-chip[data-diff="all"]').classList.add('active');
                document.getElementById('sortSelect').value = 'newest';

                refresh();
                showToast('Filtrlari tozalandi', 'info', 1500);
            }
            window.resetFilters = resetFilters;

            // ============================================================
            // EVENT LISTENERS
            // ============================================================

            searchInput.addEventListener('input', debounce(function() {
                state.search = this.value.trim();
                refresh();
            }, 350));

            document.querySelectorAll('#statusFilters .filter-chip').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#statusFilters .filter-chip').forEach(function(b) {
                        b.classList.remove('active');
                    });
                    this.classList.add('active');
                    state.status = this.dataset.status;
                    refresh();
                });
            });

            document.querySelectorAll('#difficultyFilters .filter-chip').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#difficultyFilters .filter-chip').forEach(function(b) {
                        b.classList.remove('active');
                    });
                    this.classList.add('active');
                    state.difficulty = this.dataset.diff;
                    refresh();
                });
            });

            document.getElementById('sortSelect').addEventListener('change', function() {
                state.sort = this.value;
                refresh();
            });

            loadMoreBtn.addEventListener('click', loadMore);

            document.addEventListener('keydown', function(e) {
                if (e.key === '/' && !e.ctrlKey && !e.metaKey) {
                    var tag = document.activeElement ? document.activeElement.tagName : '';
                    if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
                        e.preventDefault();
                        searchInput.focus();
                        searchInput.select();
                    }
                }
                if (e.key === 'Escape' && document.activeElement === searchInput) {
                    searchInput.value = '';
                    state.search = '';
                    refresh();
                    searchInput.blur();
                }
            });

            // ============================================================
            // INIT
            // ============================================================
            refresh();

            setTimeout(function() {
                showToast('📝 ' + allTests.length + ' ta test mavjud', 'info', 3000);
            }, 800);

            window.testsState = state;
            window.testsRefresh = refresh;

        })();
    </script>

</body>
</html>
