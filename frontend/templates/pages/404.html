<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SEO Teglari (Go backenddan dinamik keladi) -->
    <title>{{if .Title}}{{.Title}}{{else}}Sahifa topilmadi - CFM Contest{{end}}</title>
    <meta name="description" content="{{if .Description}}{{.Description}}{{else}}Dasturlash platformasi xatolik sahifasi{{end}}">
    <link rel="canonical" href="{{if .URL}}{{.URL}}{{else}}https://saytingiz.com{{end}}">
    
    <!-- Open Graph -->
    <meta property="og:title" content="{{if .Title}}{{.Title}}{{else}}Sahifa topilmadi - CFM Contest{{end}}">
    <meta property="og:description" content="{{if .Description}}{{.Description}}{{else}}Dasturlash platformasi xatolik sahifasi{{end}}">
    <meta property="og:url" content="{{if .URL}}{{.URL}}{{else}}https://saytingiz.com{{end}}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="CFM Contest">

    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-gray-50 text-gray-900">

<div class="cfm-error-wrapper" style="box-sizing: border-box; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 20px; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: transparent;">
    
    <div class="cfm-error-card" style="box-sizing: border-box; max-width: 560px; width: 100%; text-align: center; padding: 50px 40px; background: #ffffff; border-radius: 24px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06); border: 1px solid #f1f5f9; transition: transform 0.3s ease;">
        
        <!-- Yuqori qismdagi dasturlash/algoritm ikonkasi -->
        <div class="cfm-error-icon-box" style="box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; width: 96px; height: 96px; background-color: #fef2f2; border-radius: 50%; margin-bottom: 30px; animation: pulse 2s infinite;">
            <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#ef4444" style="width: 48px; height: 48px;">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14.25 9.75L16.5 12l-2.25 2.25m-4.5 0L7.5 12l2.25-2.25M6 20.25h12A2.25 2.25 0 0020.25 18V6A2.25 2.25 0 0018 3.75H6A2.25 2.25 0 003.75 6v12A2.25 2.25 0 006 20.25z" />
            </svg>
        </div>

        <!-- Katta raqamli xatolik kodi -->
        <div class="cfm-error-code" style="box-sizing: border-box; font-size: 110px; font-weight: 900; background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; margin: 0 0 15px 0; letter-spacing: -2px;">
            404
        </div>

        <!-- Dinamik H1 Sarlavha (Go backenddan keladi) -->
        <h1 style="box-sizing: border-box; font-size: 26px; font-weight: 700; color: #0f172a; margin: 0 0 12px 0; line-height: 1.3;">
            {{if .H1Title}}{{.H1Title}}{{else}}Sahifa topilmadi{{end}}
        </h1>

        <!-- Dinamik Tavsif matni (Go backenddan keladi) -->
        <p style="box-sizing: border-box; font-size: 16px; color: #64748b; line-height: 1.6; margin: 0 0 35px 0;">
            {{if .Description}}{{.Description}}{{else}}Siz qidirayotgan sahifa o'chirilgan, nomi o'zgartirilgan yoki vaqtincha mavjud emas.{{end}}
        </p>

        <!-- Pastki harakat tugmalari bloki -->
        <div class="cfm-action-group" style="box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center;">
            
            <!-- Asosiy ko'k rangli tugma -->
            <a href="/problems" class="cfm-btn-primary" style="box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; width: 100%; max-width: 280px; background-color: #2563eb; color: #ffffff; padding: 14px 28px; font-size: 15px; font-weight: 600; text-decoration: none; border-radius: 12px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); transition: all 0.2s ease-in-out;">
                Masalalar ro'yxatiga qaytish
            </a>
            
            <!-- Qo'shimcha ikkinchi darajali kichik yozuv -->
            <span style="box-sizing: border-box; font-size: 13px; color: #94a3b8; font-weight: 500; margin-top: 5px; text-transform: uppercase; letter-spacing: 0.05em;">
                — CFM Algoritm Platformasi —
            </span>
        </div>

    </div>
</div>

<!-- Sahifaga interaktivlik va go'zallik beruvchi CSS effektlari -->
<style>
    /* Tugmani ustiga borganda rangining o'zgarishi va bir oz ko'tarilishi */
    .cfm-btn-primary:hover {
        background-color: #1d4ed8 !important;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(29, 78, 216, 0.3) !important;
    }
    .cfm-btn-primary:active {
        transform: translateY(0);
    }

    /* Karta ustiga borgandagi yengil effekt */
    .cfm-error-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.08) !important;
    }

    /* Ikonka uchun pulsatsiya (puls) animatsiyasi */
    @keyframes pulse {
        0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.2); }
        70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
        100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    /* Mobil qurilmalar uchun moslashuvchanlik */
    @media (max-width: 480px) {
        .cfm-error-card {
            padding: 40px 20px !important;
        }
        .cfm-error-code {
            font-size: 90px !important;
        }
        .cfm-error-icon-box {
            width: 80px !important;
            height: 80px !important;
        }
    }
</style>

</body>
</html>
