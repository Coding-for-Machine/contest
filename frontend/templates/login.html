<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Kirish — CfM Contest</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />

    <!-- 🆕 Guest-only guard: token bor bo'lsa darhol chiqarib yuboradi.
         main.js yuklanishini kutmaydi, /verify API chaqirmaydi — faqat localStorage tekshiradi. -->
    <script>
    (function () {
        if (localStorage.getItem('cfm_auth_token')) {
            var next = new URLSearchParams(location.search).get('next') || '/';
            location.replace(next);
        }
    })();
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; background: #ffffff; font-family: 'Inter', sans-serif; }
        
        .login-bg { position: fixed; inset: 0; z-index: 0; background: #ffffff; overflow: hidden; }
        .shape { position: absolute; opacity: 0.06; animation: floatShape 25s infinite ease-in-out; pointer-events: none; }
        .shape svg { width: 100%; height: 100%; display: block; }
        .shape-1 { top: 5%; left: 5%; width: 120px; height: 120px; animation-duration: 28s; }
        .shape-2 { top: 15%; right: 8%; width: 80px; height: 80px; animation-duration: 22s; animation-delay: 3s; }
        .shape-3 { bottom: 20%; left: 8%; width: 100px; height: 100px; animation-duration: 26s; animation-delay: 5s; }
        .shape-4 { bottom: 10%; right: 5%; width: 140px; height: 140px; animation-duration: 30s; animation-delay: 2s; }
        .shape-5 { top: 45%; left: 2%; width: 60px; height: 60px; animation-duration: 20s; animation-delay: 7s; }
        .shape-6 { top: 40%; right: 2%; width: 70px; height: 70px; animation-duration: 24s; animation-delay: 4s; }
        .shape-7 { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 200px; height: 200px; animation-duration: 35s; animation-delay: 1s; opacity: 0.04; }
        
        @keyframes floatShape {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
            25% { transform: translate(30px, -40px) rotate(90deg) scale(1.1); }
            50% { transform: translate(-20px, 30px) rotate(180deg) scale(0.9); }
            75% { transform: translate(40px, 20px) rotate(270deg) scale(1.05); }
        }
        
        .login-grid { position: fixed; inset: 0; z-index: 1; background-image: linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px); background-size: 60px 60px; pointer-events: none; }
        .login-wrapper { position: relative; z-index: 10; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .login-card { width: 100%; max-width: 380px; background: rgba(255,255,255,0.92); backdrop-filter: blur(20px); border: 1px solid rgba(0,0,0,0.06); border-radius: 24px; padding: 48px 36px 36px; box-shadow: 0 8px 40px rgba(0,0,0,0.04); text-align: center; }
        
        .login-logo { width: 96px; height: 96px; margin: 0 auto 24px; display: flex; align-items: center; justify-content: center; border-radius: 50%; overflow: hidden; background: #f8f9fa; border: 2px solid #e5e7eb; transition: all 0.3s; }
        .login-logo:hover { transform: scale(1.04); box-shadow: 0 8px 32px rgba(0,0,0,0.08); }
        .login-logo img { width: 100%; height: 100%; object-fit: contain; display: block; padding: 12px; }
        
        .login-title { font-size: 24px; font-weight: 700; color: #111827; margin-bottom: 6px; }
        .login-subtitle { font-size: 14px; color: #6b7280; line-height: 1.6; margin-bottom: 32px; }
        .login-subtitle a { color: #111827; text-decoration: none; font-weight: 600; border-bottom: 1.5px solid #e5e7eb; }
        .login-subtitle a:hover { border-color: #111827; }
        
        .otp-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .otp-box { width: 46px; height: 54px; background: #f9fafb; border: 2px solid #e5e7eb; border-radius: 12px; text-align: center; font-size: 22px; font-weight: 700; color: #111827; outline: none; transition: all 0.2s; font-family: 'JetBrains Mono', monospace; -webkit-appearance: none; -moz-appearance: textfield; }
        .otp-box::-webkit-inner-spin-button, .otp-box::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .otp-box:focus { border-color: #111827; background: #ffffff; box-shadow: 0 0 0 4px rgba(0,0,0,0.05); transform: translateY(-2px); }
        .otp-box.filled { border-color: #9ca3af; background: #f3f4f6; }
        .otp-box.error { border-color: #ef4444; background: #fef2f2; animation: shake 0.4s; }
        .otp-box.success { border-color: #22c55e; background: #f0fdf4; color: #22c55e; }
        
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
        
        .login-btn { width: 100%; padding: 16px; background: #111827; color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .login-btn:hover:not(:disabled) { background: #1f2937; transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        .resend-btn { background: none; border: none; color: #6b7280; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; transition: color 0.2s; }
        .resend-btn:hover:not(:disabled) { color: #111827; }
        .resend-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .back-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 16px; color: #9ca3af; font-size: 13px; text-decoration: none; transition: color 0.2s; }
        .back-link:hover { color: #111827; }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        @media (max-width: 480px) {
            .login-card { padding: 32px 20px 24px; }
            .login-logo { width: 80px; height: 80px; }
            .otp-box { width: 38px; height: 46px; font-size: 18px; }
            .otp-row { gap: 6px; }
        }
    </style>
</head>
<body>
    <div class="login-bg">
        <div class="shape shape-1"><svg viewBox="0 0 100 100"><polygon points="50 0,93 25,93 75,50 100,7 75,7 25" fill="#111827"/></svg></div>
        <div class="shape shape-2"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#111827"/></svg></div>
        <div class="shape shape-3"><svg viewBox="0 0 100 100"><polygon points="50 0,100 100,0 100" fill="#111827"/></svg></div>
        <div class="shape shape-4"><svg viewBox="0 0 100 100"><rect x="10" y="10" width="80" height="80" rx="4" fill="#111827"/></svg></div>
        <div class="shape shape-5"><svg viewBox="0 0 100 100"><polygon points="50 0,95 38,77 90,23 90,5 38" fill="#111827"/></svg></div>
        <div class="shape shape-6"><svg viewBox="0 0 100 100"><polygon points="50 5,95 50,50 95,5 50" fill="#111827"/></svg></div>
        <div class="shape shape-7"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="#111827" stroke-width="4"/><circle cx="50" cy="50" r="25" fill="none" stroke="#111827" stroke-width="3"/></svg></div>
    </div>
    <div class="login-grid"></div>

    <div class="login-wrapper">
        <div class="login-card">
            <a href="/" class="login-logo">
                <img src="/assets/img/cfm_logo.webp" alt="CfM Contest" loading="lazy"/>
            </a>
            <h1 class="login-title">CfM Contest</h1>
            <p class="login-subtitle">
                <a href="https://t.me/cfm_login_bot?start=competition" target="_blank">@cfm_login_bot</a>
                dan 6 xonali kodni oling
            </p>

            <form id="otpForm" onsubmit="return handleSubmit(event)">
                <div class="otp-row" id="otpRow">
                    <input type="number" class="otp-box" maxlength="1" max="9" min="0" autocomplete="off" inputmode="numeric"/>
                    <input type="number" class="otp-box" maxlength="1" max="9" min="0" autocomplete="off" inputmode="numeric"/>
                    <input type="number" class="otp-box" maxlength="1" max="9" min="0" autocomplete="off" inputmode="numeric"/>
                    <input type="number" class="otp-box" maxlength="1" max="9" min="0" autocomplete="off" inputmode="numeric"/>
                    <input type="number" class="otp-box" maxlength="1" max="9" min="0" autocomplete="off" inputmode="numeric"/>
                    <input type="number" class="otp-box" maxlength="1" max="9" min="0" autocomplete="off" inputmode="numeric"/>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                    Kirish
                </button>
            </form>

            <!-- Qayta jo'natish tugmasi -->
            <button type="button" class="resend-btn" id="resendBtn" onclick="resendOTP()">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M1 4v6h6"/>
                    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                </svg>
                Yangi kod jo'natish
            </button>

            <a href="/" class="back-link">
                <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
                Bosh sahifaga qaytish
            </a>
        </div>
    </div>

    <script src="/assets/js/main.js"></script>
    
    <script>
        (function() {
            'use strict';

            let isSubmitting = false;
            let resendTimer = null;
            let resendCountdown = 0;
            var API_BASE = window.RC_API_BASE || 'https://symmetrical-carnival-97qrqvqjvwq7c9prq-8080.app.github.dev/api';

            document.addEventListener('DOMContentLoaded', function() {
                // Guest-guard yuqorida <head>da bajarildi (localStorage asosida, /verify chaqirmasdan).
                // Bu yerda faqat OTP inputga fokus qo'yamiz.
                var boxes = document.querySelectorAll('.otp-box');
                if (boxes[0]) setTimeout(function() { boxes[0].focus(); }, 100);

                boxes.forEach(function(box, idx) {
                    box.addEventListener('input', function() {
                        box.value = box.value.replace(/[^0-9]/g, '').slice(0, 1);
                        box.classList.toggle('filled', box.value !== '');
                        if (box.value && idx < boxes.length - 1) boxes[idx + 1].focus();
                        var code = getCode();
                        if (code.length === 6 && !isSubmitting) submitCode(code);
                    });

                    box.addEventListener('keydown', function(e) {
                        if (e.key === 'Backspace' && !box.value && idx > 0) {
                            boxes[idx - 1].value = '';
                            boxes[idx - 1].classList.remove('filled');
                            boxes[idx - 1].focus();
                        }
                    });

                    box.addEventListener('paste', function(e) {
                        e.preventDefault();
                        var pasted = (e.clipboardData || window.clipboardData).getData('text').trim();
                        if (/^\d{6}$/.test(pasted)) {
                            boxes.forEach(function(b, i) { b.value = pasted[i]; b.classList.add('filled'); });
                            boxes[5].focus();
                            if (!isSubmitting) submitCode(pasted);
                        }
                    });
                });
            });

            function getCode() {
                return Array.from(document.querySelectorAll('.otp-box')).map(function(b) { return b.value; }).join('');
            }

            function handleSubmit(e) {
                e.preventDefault();
                var code = getCode();
                if (code.length < 6) {
                    if (window.showToast) showToast("Iltimos, 6 xonali kodni to'liq kiriting!", 'warning');
                    else alert("Iltimos, 6 xonali kodni to'liq kiriting!");
                    return false;
                }
                submitCode(code);
                return false;
            }

            async function submitCode(code) {
                if (isSubmitting) return;
                if (!/^\d{6}$/.test(code)) {
                    if (window.showToast) showToast('OTP faqat 6 xonali raqam bo\'lishi kerak!', 'error');
                    return;
                }

                isSubmitting = true;
                var btn = document.getElementById('loginBtn');
                var originalText = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = `<span style="width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block;flex-shrink:0;"></span> Tekshirilmoqda...`;

                try {
                    var data;
                    var requestBody = { otp: String(code) };

                   
                    var res = await fetch(API_BASE + '/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                            body: JSON.stringify(requestBody)
                      });
                    if (!res.ok) {
                            var errData = await res.json().catch(function() { return {}; });
                            throw new Error(errData.error || errData.detail || 'Tasdiqlash kodi xato!');
                      }
                    data = await res.json();

                    if (data.t) {
                        if (window.Auth) { Auth.setToken(data.t); Auth.setUser(data.u || {}); }
                        else { localStorage.setItem('cfm_auth_token', data.t); localStorage.setItem('cfm_user_data', JSON.stringify(data.u || {})); }

                        document.querySelectorAll('.otp-box').forEach(function(b) {
                            b.classList.remove('filled', 'error');
                            b.classList.add('success');
                        });

                        var name = data.u?.f || data.u?.u || 'Chempion';
                        if (window.showToast) showToast('Xush kelibsiz, ' + name + '! 🏆', 'success');

                        setTimeout(function() {
                            var next = new URLSearchParams(location.search).get('next') || '/';
                            window.location.replace(next);
                        }, 1200);
                    } else {
                        throw new Error("Serverdan token qaytmadi.");
                    }

                } catch (err) {
                    console.error('Login error:', err);
                    
                    // Xatolikni chiroyli ko'rsatish
                    var errorMsg = err.message;
                    if (errorMsg.includes('eskirgan') || errorMsg.includes('noto')) {
                        errorMsg = '❌ OTP kodi eskirgan yoki noto\'g\'ri. Iltimos, yangi kod oling!';
                        // Qayta jo'natish tugmasini ko'rsatish
                        document.getElementById('resendBtn').style.display = 'inline-flex';
                    } else if (errorMsg.includes('ko\'p')) {
                        errorMsg = '⏳ Juda ko\'p urinish. Iltimos, 1 daqiqa kuting!';
                    }
                    
                    if (window.showToast) showToast(errorMsg, 'error');
                    else alert(errorMsg);
                    
                    document.querySelectorAll('.otp-box').forEach(function(b) {
                        b.value = '';
                        b.classList.remove('filled', 'success');
                        b.classList.add('error');
                    });
                    
                    setTimeout(function() {
                        document.querySelectorAll('.otp-box').forEach(function(b) { b.classList.remove('error'); });
                        var first = document.querySelector('.otp-box');
                        if (first) first.focus();
                    }, 600);
                } finally {
                    isSubmitting = false;
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            }

            // Qayta jo'natish funksiyasi
            window.resendOTP = function() {
                var btn = document.getElementById('resendBtn');
                if (btn.disabled) return;
                
                btn.disabled = true;
                resendCountdown = 30;
                btn.innerHTML = '⏳ ' + resendCountdown + 's';
                
                // Telegram bot ga xabar yuborish
                window.open('https://t.me/cfm_login_bot?start=resend', '_blank');
                
                if (window.showToast) {
                    showToast('📨 Yangi kod jo\'natildi! Telegram bot ni tekshiring.', 'info');
                }
                
                // OTP inputlarni tozalash
                document.querySelectorAll('.otp-box').forEach(function(b) {
                    b.value = '';
                    b.classList.remove('filled', 'success', 'error');
                });
                var first = document.querySelector('.otp-box');
                if (first) first.focus();
                
                // Tugmani vaqtinchalik bloklash
                resendTimer = setInterval(function() {
                    resendCountdown--;
                    btn.innerHTML = '⏳ ' + resendCountdown + 's';
                    if (resendCountdown <= 0) {
                        clearInterval(resendTimer);
                        btn.disabled = false;
                        btn.innerHTML = `
                            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path d="M1 4v6h6"/>
                                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                            </svg>
                            Yangi kod jo'natish
                        `;
                    }
                }, 1000);
            };

            window.submitCode = submitCode;
            window.handleSubmit = handleSubmit;
            window.getCode = getCode;

        })();
    </script>
</body>
</html>
