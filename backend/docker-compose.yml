services:
  db:
    image: postgres:16-alpine
    container_name: cfm_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cfm_network

  redis:
    image: redis:7.2-alpine
    container_name: cfm_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cfm_network

  minio:
    image: firstfinger/minio:latest-arm64
    container_name: cfm_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
      - "9002:9002"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cfm_network

  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: cfm_web
    restart: always
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
      PISTON_URL: ${PISTON_URL}
      PISTON_API_KEY: ${PISTON_API_KEY}
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py runbolt --host 0.0.0.0 --port 8000 --processes 4"
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - cfm_network

  celery-worker:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: cfm_celery_worker
    restart: always
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
      PISTON_URL: ${PISTON_URL}
      PISTON_API_KEY: ${PISTON_API_KEY}
    command: celery -A app worker --loglevel=info --concurrency=4
    volumes:
      - ./app:/app
    depends_on:
      - db
      - redis
    networks:
      - cfm_network

  celery-beat:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: cfm_celery_beat
    restart: always
    env_file: .env
    environment:
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PISTON_URL: ${PISTON_URL}
      PISTON_API_KEY: ${PISTON_API_KEY}
    command: celery -A app beat --loglevel=info
    volumes:
      - ./app:/app
    depends_on:
      - redis
    networks:
      - cfm_network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  cfm_network:
    driver: bridge