{% extends "admin/change_list.html" %}

{% block content %}
<div class="custom-user-changelist">
    <!-- Statistikalar kartochkalari -->
    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem;">
        <div style="background: white; padding: 1rem; border-radius: 8px; border: 1px solid #e2e8f0;">
            <h3 style="margin: 0 0 0.5rem 0; font-size: 0.875rem; color: #64748b;">📊 Jami foydalanuvchilar</h3>
            <p style="font-size: 1.875rem; font-weight: bold; margin: 0; color: #3b82f6;">{{ total_users }}</p>
        </div>
        
        <div style="background: white; padding: 1rem; border-radius: 8px; border: 1px solid #e2e8f0;">
            <h3 style="margin: 0 0 0.5rem 0; font-size: 0.875rem; color: #64748b;">✅ Faol foydalanuvchilar</h3>
            <p style="font-size: 1.875rem; font-weight: bold; margin: 0; color: #22c55e;">{{ active_users }}</p>
        </div>
        
        <div style="background: white; padding: 1rem; border-radius: 8px; border: 1px solid #e2e8f0;">
            <h3 style="margin: 0 0 0.5rem 0; font-size: 0.875rem; color: #64748b;">❌ Nofaol foydalanuvchilar</h3>
            <p style="font-size: 1.875rem; font-weight: bold; margin: 0; color: #ef4444;">{{ inactive_users }}</p>
        </div>
        
        <div style="background: white; padding: 1rem; border-radius: 8px; border: 1px solid #e2e8f0;">
            <h3 style="margin: 0 0 0.5rem 0; font-size: 0.875rem; color: #64748b;">📅 Bugun qo'shilganlar</h3>
            <p style="font-size: 1.875rem; font-weight: bold; margin: 0; color: #a855f7;">{{ today_users }}</p>
        </div>
    </div>

    <!-- Asosiy changelist -->
    {{ block.super }}
</div>
{% endblock %}
