{% load i18n %}

<div class="mb-6 grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-5">


    <!-- Total -->
    <div class="rounded-xl bg-white dark:bg-gray-900 shadow border border-gray-200 dark:border-gray-800 p-5">

        <div class="flex items-center justify-between">

            <div>
                <p class="text-sm text-gray-500">
                    Jami statuslar
                </p>

                <h2 class="text-3xl font-bold mt-2">
                    {{ ms_total }}
                </h2>
            </div>


            <div class="flex items-center justify-center w-12 h-12 rounded-xl bg-primary-100 text-primary-600">

                <span class="material-symbols-outlined text-3xl">
                    menu_book
                </span>

            </div>

        </div>

    </div>



    <!-- Completed -->

    <div class="rounded-xl bg-white dark:bg-gray-900 shadow border border-gray-200 dark:border-gray-800 p-5">

        <div class="flex items-center justify-between">


            <div>

                <p class="text-sm text-gray-500">
                    Tugatilgan
                </p>


                <h2 class="text-3xl font-bold mt-2 text-green-600">
                    {{ ms_completed }}
                </h2>

            </div>


            <div class="flex items-center justify-center w-12 h-12 rounded-xl bg-green-100 text-green-600">

                <span class="material-symbols-outlined text-3xl">
                    task_alt
                </span>

            </div>


        </div>

    </div>



    <!-- Progress -->

    <div class="rounded-xl bg-white dark:bg-gray-900 shadow border border-gray-200 dark:border-gray-800 p-5">

        <div class="flex items-center justify-between">


            <div>

                <p class="text-sm text-gray-500">
                    Jarayonda
                </p>


                <h2 class="text-3xl font-bold mt-2 text-yellow-500">
                    {{ ms_in_progress }}
                </h2>

            </div>


            <div class="flex items-center justify-center w-12 h-12 rounded-xl bg-yellow-100 text-yellow-600">


                <span class="material-symbols-outlined text-3xl">
                    pending_actions
                </span>


            </div>


        </div>

    </div>



    <!-- Progress percent -->

    <div class="rounded-xl bg-white dark:bg-gray-900 shadow border border-gray-200 dark:border-gray-800 p-5">

        <div class="flex items-center justify-between">


            <div>

                <p class="text-sm text-gray-500">
                    Umumiy progress
                </p>


                <h2 class="text-3xl font-bold mt-2">
                    {{ ms_percent }}%
                </h2>


            </div>


            <div class="flex items-center justify-center w-12 h-12 rounded-xl bg-purple-100 text-purple-600">


                <span class="material-symbols-outlined text-3xl">
                    monitoring
                </span>


            </div>


        </div>


        <div class="mt-4 h-2 bg-gray-200 rounded-full">

            <div 
                class="h-2 bg-purple-500 rounded-full"
                style="width: {{ ms_percent }}%">
            </div>

        </div>


    </div>


</div>
