<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>403 — Ruxsat yo'q · CfM Contest</title>
<style>
  :root{
    --bg: #0a0b0f;
    --bg-soft: #101218;
    --card: #14161d;
    --rule: #21242e;
    --text: #eef1f6;
    --muted: #7b8494;
    --muted-2: #4d5566;

    --gold: #f5b301;
    --gold-bg: rgba(245,179,1,0.12);
    --gold-text: #ffcb3d;

    --red-bg: rgba(240,70,70,0.14);
    --red-text: #ff7a72;

    --sky-bg: rgba(56,150,255,0.12);
    --sky-text: #6fb2ff;

    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  *{ box-sizing: border-box; }
  html, body{ height: 100%; margin: 0; }

  body{
    background:
      radial-gradient(900px 480px at 12% -8%, rgba(245,179,1,0.08), transparent 60%),
      radial-gradient(700px 420px at 108% 105%, rgba(240,70,70,0.07), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
  }

  /* faint grid texture */
  .grid-fade{
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(700px 460px at 50% 38%, black, transparent 75%);
  }

  .card{
    position: relative;
    width: 100%;
    max-width: 460px;
    background: linear-gradient(180deg, var(--card), var(--bg-soft));
    border: 1px solid var(--rule);
    border-radius: 20px;
    padding: 40px 36px 32px;
    box-shadow: 0 40px 90px -30px rgba(0,0,0,0.65);
    text-align: center;
    animation: rise 0.5s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise{
    from{ opacity: 0; transform: translateY(10px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .card{ animation: none; }
  }

  /* brand row */
  .brand{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 12.5px;
    letter-spacing: 0.03em;
    margin-bottom: 26px;
  }
  .brand b{ color: var(--text); font-weight: 600; }

  /* verdict ring */
  .ring-wrap{
    position: relative;
    width: 116px;
    height: 116px;
    margin: 0 auto 22px;
  }
  .ring{
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--red-text) 0deg 46deg, var(--rule) 46deg 360deg);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px));
    animation: spin 5s linear infinite;
    opacity: 0.85;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){
    .ring{ animation: none; }
  }
  .ring-core{
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--rule);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .ring-core .num{
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }
  .ring-core .lock{
    margin-top: 4px;
    opacity: 0.8;
  }

  /* pill badge — mirrors the product's own admin badge style */
  .pill{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin-bottom: 16px;
  }
  .pill.red{ background: var(--red-bg); color: var(--red-text); }

  h1{
    margin: 0 0 10px;
    font-size: 25px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  p.desc{
    margin: 0 auto 26px;
    max-width: 340px;
    color: var(--muted);
    font-size: 14.5px;
    line-height: 1.65;
  }

  /* meta chips */
  .meta{
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 30px;
  }
  .chip{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--rule);
    font-size: 12.5px;
    color: var(--muted);
  }
  .chip b{ color: var(--text); font-weight: 600; }
  .chip.gold{ background: var(--gold-bg); border-color: transparent; color: var(--gold-text); }
  .chip.gold b{ color: var(--gold-text); }

  hr.rule{
    border: none;
    border-top: 1px solid var(--rule);
    margin: 0 0 26px;
  }

  .actions{
    display: flex;
    gap: 10px;
  }
  .btn{
    flex: 1;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    padding: 12px 16px;
    border-radius: 10px;
    text-decoration: none;
    border: 1px solid transparent;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, filter .15s ease;
    cursor: pointer;
  }
  .btn:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }

  .btn-primary{
    background: var(--gold);
    color: #1a1300;
  }
  .btn-primary:hover{ transform: translateY(-1px); filter: brightness(1.06); }

  .btn-ghost{
    background: transparent;
    color: var(--text);
    border-color: var(--rule);
  }
  .btn-ghost:hover{ border-color: var(--muted-2); }

  .footnote{
    margin-top: 20px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--muted-2);
  }

  @media (max-width: 420px){
    .card{ padding: 32px 22px 26px; border-radius: 16px; }
    h1{ font-size: 22px; }
    .actions{ flex-direction: column; }
  }
</style>
</head>
<body>

  <div class="grid-fade"></div>

  <main class="card">

    <div class="brand">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
        <path d="M6 3h12v3a6 6 0 0 1-6 6 6 6 0 0 1-6-6V3z" stroke="#f5b301" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M6 4H3v1a4 4 0 0 0 4 4M18 4h3v1a4 4 0 0 1-4 4" stroke="#7b8494" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M12 12v4M9 20h6M10 16h4v4h-4v-4z" stroke="#f5b301" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <span><b>CfM</b> Contest</span>
    </div>

    <div class="ring-wrap" aria-hidden="true">
      <div class="ring"></div>
      <div class="ring-core">
        <span class="num">403</span>
        <svg class="lock" width="14" height="14" viewBox="0 0 24 24" fill="none">
          <rect x="5" y="11" width="14" height="9" rx="2" stroke="#ff7a72" stroke-width="1.8"/>
          <path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="#ff7a72" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <span class="pill red">🔒 Ruxsat rad etildi</span>

    <h1>Bu bo'limga kirish huquqingiz yo'q</h1>
    <p class="desc">
      Hisobingizga ushbu sahifa yoki amal uchun ruxsat berilmagan.
      Agar bu xato deb hisoblasangiz, administratorga murojaat qiling.
    </p>

    <div class="meta">
      <span class="chip">👤 <b>Joriy hisob</b></span>
      <span class="chip gold">🔑 <b>Yuqori huquq talab qilinadi</b></span>
    </div>

    <hr class="rule">

    <div class="actions">
      <a class="btn btn-primary" href="{% url 'admin:index' %}">Bosh sahifaga</a>
      <a class="btn btn-ghost" href="https://t.me/Coding_for_Machines">Murojaat qilish</a>
    </div>

    <div class="footnote">HTTP 403 · Forbidden</div>

  </main>

</body>
</html>
